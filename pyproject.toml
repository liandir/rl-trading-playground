[project]
name = "rl-trading-playground"
version = "0.1.0"
description = "A multi-currency trading package."
authors = [
    { name = "Leander Olschowy", email = "leanderolschowy@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bokeh>=3.9.0",
    "fastapi>=0.115.0",
    "forex",
    "matplotlib>=3.10.9",
    "pydantic>=2.7",
    "pydoc-builder",
    "structlog>=24.1",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "uvicorn[standard]>=0.30",
    "watchfiles>=0.22",
    "websockets>=12,<16",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "notebook>=7.5.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
forex = { git = "ssh://git@github.com/liandir/forex.git" }
pydoc-builder = { git = "ssh://git@github.com/liandir/pydoc-builder.git", rev = "main" }

[project.urls]
Repository = "https://github.com/liandir/rl-trading-playground"
